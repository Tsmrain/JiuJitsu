services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: corpocmente_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: corpocmente_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: corpocmente
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
      - ./pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d corpocmente"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  postgrest:
    image: postgrest/postgrest:latest
    container_name: corpocmente_postgrest
    ports:
      - "3000:3000"
      - "3001:3000"
    environment:
      PGRST_DB_URI: postgres://authenticator:mysecretpassword@postgres:5432/corpocmente
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: super-secret-jwt-token-key-for-corpocmente-dev-32chars
      PGRST_SERVER_PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
