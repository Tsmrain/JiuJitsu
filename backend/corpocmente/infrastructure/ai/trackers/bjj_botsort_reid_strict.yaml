# BoT-SORT con ReID estricto, buffer largo y new_track_thresh alto para evitar tracks espurios
tracker_type: botsort
track_high_thresh: 0.25
track_low_thresh: 0.05
new_track_thresh: 0.55   # Más alto — evita crear tracks de cajas débiles
track_buffer: 600
match_thresh: 0.8
fuse_score: True
gmc_method: sparseOptFlow
proximity_thresh: 0.5
appearance_thresh: 0.85  # Muy estricto
with_reid: True
model: auto
