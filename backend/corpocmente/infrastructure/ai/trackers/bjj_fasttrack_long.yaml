# FastTracker con buffer largo (600 frames) para oclusiones prolongadas en suelo
tracker_type: fasttrack
track_high_thresh: 0.25
track_low_thresh: 0.05
new_track_thresh: 0.35
track_buffer: 600
match_thresh: 0.8
fuse_score: True
reset_velocity_offset_occ: 5
reset_pos_offset_occ: 3
enlarge_bbox_occ: 1.2     # Agrandar bbox predicha durante oclusión
dampen_motion_occ: 0.5
active_occ_to_lost_thresh: 10
occ_cover_thresh: 0.5     # Umbral de cobertura para declarar oclusión
occ_reappear_window: 40
init_iou_suppress: 0.7
