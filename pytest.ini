[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: Pruebas unitarias de dominio, aplicación e infraestructura con mocks
    integration: Pruebas de integración entre capas y servicios externos
    real_model: Pruebas pesadas que ejecutan el modelo real RTMPose3D en Google Colab con GPU
addopts = -ra -q
